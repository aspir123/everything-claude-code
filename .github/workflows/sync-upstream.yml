name: Sync Fork with Upstream (CI-gated auto-merge)

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      sync_test_mode:
        description: "Dry run: fetch and merge locally without pushing or opening a PR"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sync-upstream-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    name: Prepare and CI-gate upstream sync PR
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: sync-upstream
      deployment: false
    env:
      TARGET_BRANCH: main
      UPSTREAM_REPOSITORY: affaan-m/ECC
      UPSTREAM_BRANCH: main
    steps:
      - name: Check out fork history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Merge upstream into a sync branch
        env:
          GH_TOKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_test_mode && github.token || secrets.SYNC_UPSTREAM_TOKEN || github.token }}
          SYNC_UPSTREAM_TOKEN: ${{ secrets.SYNC_UPSTREAM_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_OWNER: ${{ github.repository_owner }}
          DRY_RUN: ${{ inputs.sync_test_mode }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" != "true" ] && [ -z "$SYNC_UPSTREAM_TOKEN" ]; then
            echo "::error::SYNC_UPSTREAM_TOKEN is required for non-dry-run syncs."
            exit 1
          fi

          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --filter=blob:none --no-tags origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          git fetch --filter=blob:none --no-tags upstream "+refs/heads/${UPSTREAM_BRANCH}:refs/remotes/upstream/${UPSTREAM_BRANCH}"

          TARGET_REF="origin/${TARGET_BRANCH}"
          UPSTREAM_REF="upstream/${UPSTREAM_BRANCH}"
          UPSTREAM_SHA="$(git rev-parse "${UPSTREAM_REF}")"
          SHORT_SHA="${UPSTREAM_SHA:0:12}"
          UPSTREAM_AHEAD="$(git rev-list --count "${TARGET_REF}..${UPSTREAM_REF}")"
          SYNC_PR_MARKER="<!-- codex-upstream-sync:${UPSTREAM_REPOSITORY}:${UPSTREAM_BRANCH} -->"

          if [ "$UPSTREAM_AHEAD" -eq 0 ]; then
            echo "Upstream is already contained in ${TARGET_BRANCH}; nothing to sync."
            exit 0
          fi

          OPEN_PRS_JSON="$(gh api --paginate --slurp \
            "repos/${GH_REPO}/pulls?state=open&base=${TARGET_BRANCH}&per_page=100")"
          OPEN_SYNC_BRANCH="$(jq -r --arg marker "$SYNC_PR_MARKER" --arg owner "$GH_OWNER" '
            [.[][] | select(.head.repo.full_name == env.GH_REPO)
             | select(.user.login == $owner)
             | select((.body // "") | contains($marker))
             | select(.head.ref | startswith("automation/sync-upstream-"))]
            | sort_by(.created_at) | last | .head.ref // ""' <<< "$OPEN_PRS_JSON")"

          if [ -n "$OPEN_SYNC_BRANCH" ]; then
            SYNC_BRANCH="$OPEN_SYNC_BRANCH"
            git fetch --filter=blob:none --no-tags origin "refs/heads/$SYNC_BRANCH:refs/remotes/origin/$SYNC_BRANCH"
            git switch --create "$SYNC_BRANCH" --track "origin/$SYNC_BRANCH"
          else
            SYNC_BRANCH="automation/sync-upstream-$SHORT_SHA"
            SUFFIX=1
            while git ls-remote --exit-code --heads origin "refs/heads/$SYNC_BRANCH" >/dev/null 2>&1; do
              SYNC_BRANCH="automation/sync-upstream-$SHORT_SHA-$SUFFIX"
              SUFFIX=$((SUFFIX + 1))
            done
            git switch --create "$SYNC_BRANCH" "$TARGET_REF"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit "$TARGET_REF"
          git merge --no-edit "$UPSTREAM_REF"

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run completed. No branch was pushed and no PR was opened."
            exit 0
          fi

          gh auth setup-git --hostname github.com
          git push --set-upstream origin "$SYNC_BRANCH"

          OPEN_PRS_JSON="$(gh api --paginate --slurp \
            "repos/${GH_REPO}/pulls?state=open&base=${TARGET_BRANCH}&per_page=100")"
          PR_NUMBER="$(jq -r --arg branch "$SYNC_BRANCH" --arg marker "$SYNC_PR_MARKER" --arg owner "$GH_OWNER" '
            [.[][] | select(.head.repo.full_name == env.GH_REPO)
             | select(.user.login == $owner)
             | select((.body // "") | contains($marker))
             | select(.head.ref == $branch)]
            | .[0].number // ""' <<< "$OPEN_PRS_JSON")"

          PR_TITLE="chore: sync upstream ${UPSTREAM_REPOSITORY}@${SHORT_SHA}"
          PR_BODY="${SYNC_PR_MARKER}

          Automated weekly upstream synchronization for ${TARGET_BRANCH} from ${UPSTREAM_REPOSITORY} (${UPSTREAM_BRANCH} at ${UPSTREAM_SHA}).

          The upstream commit history is preserved on this dedicated sync branch. No manual review is requested. This workflow waits for the CI workflow to finish successfully on the exact PR head commit, rechecks that the PR head has not changed, then merges the PR without bypassing repository rules. It never pushes directly to ${TARGET_BRANCH}.

          Required setup: create a GitHub Actions environment named sync-upstream, allow deployments only from the main branch (do not allow refs/pull/*/merge), and store SYNC_UPSTREAM_TOKEN as an environment secret, not a repository secret. Use a fine-grained token limited to this repository with Contents: read/write, Pull requests: read/write, Workflows: read/write, and Actions: read. Do not add an environment approval requirement."

          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" --repo "$GH_REPO" --title "$PR_TITLE" --body "$PR_BODY"
          else
            gh pr create --repo "$GH_REPO" --base "$TARGET_BRANCH" --head "$SYNC_BRANCH" --title "$PR_TITLE" --body "$PR_BODY"
            PR_NUMBER="$(gh pr view "$SYNC_BRANCH" --repo "$GH_REPO" --json number --jq '.number')"
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "::error::Could not identify the upstream sync pull request."
            exit 1
          fi

          PR_STATE="$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json state --jq '.state')"
          PR_HEAD_SHA="$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json headRefOid --jq '.headRefOid')"
          if [ "$PR_STATE" != "OPEN" ] || [ -z "$PR_HEAD_SHA" ]; then
            echo "::error::The upstream sync pull request is not open or its head SHA could not be read."
            exit 1
          fi

          CI_RUN_ID=""
          for attempt in $(seq 1 30); do
            CI_RUNS_JSON="$(gh run list --repo "$GH_REPO" --workflow .github/workflows/ci.yml \
              --commit "$PR_HEAD_SHA" --event pull_request --limit 100 \
              --json databaseId,event,headSha,workflowName)"
            CI_RUN_ID="$(jq -r --arg sha "$PR_HEAD_SHA" \
              '[.[] | select(.headSha == $sha and .event == "pull_request" and .workflowName == "CI")][0].databaseId // ""' \
              <<< "$CI_RUNS_JSON")"
            if [ -n "$CI_RUN_ID" ]; then
              break
            fi
            sleep 10
          done

          if [ -z "$CI_RUN_ID" ]; then
            echo "::error::No CI workflow run appeared for the exact PR head within five minutes; leaving the PR open."
            exit 1
          fi

          CI_COMPLETED=false
          for attempt in $(seq 1 330); do
            CI_RUN_JSON="$(gh api "repos/${GH_REPO}/actions/runs/${CI_RUN_ID}" \
              --jq '{id,head_sha,event,status,conclusion,name}')"
            CI_RUN_HEAD_SHA="$(jq -r '.head_sha // ""' <<< "$CI_RUN_JSON")"
            CI_RUN_EVENT="$(jq -r '.event // ""' <<< "$CI_RUN_JSON")"
            CI_RUN_NAME="$(jq -r '.name // ""' <<< "$CI_RUN_JSON")"
            CI_RUN_STATUS="$(jq -r '.status // ""' <<< "$CI_RUN_JSON")"
            CI_RUN_CONCLUSION="$(jq -r '.conclusion // ""' <<< "$CI_RUN_JSON")"

            if [ "$CI_RUN_HEAD_SHA" != "$PR_HEAD_SHA" ] || [ "$CI_RUN_EVENT" != "pull_request" ] || [ "$CI_RUN_NAME" != "CI" ]; then
              echo "::error::The located CI run does not match the expected PR head and workflow."
              exit 1
            fi

            if [ "$CI_RUN_STATUS" = "completed" ]; then
              if [ "$CI_RUN_CONCLUSION" != "success" ]; then
                echo "::error::CI completed with conclusion '$CI_RUN_CONCLUSION'; leaving the PR open."
                exit 1
              fi
              CI_COMPLETED=true
              break
            fi

            sleep 60
          done

          if [ "$CI_COMPLETED" != "true" ]; then
            echo "::error::CI did not complete within the wait window; leaving the PR open."
            exit 1
          fi

          PR_CURRENT_STATE="$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json state --jq '.state')"
          PR_CURRENT_HEAD_SHA="$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json headRefOid --jq '.headRefOid')"
          if [ "$PR_CURRENT_STATE" != "OPEN" ] || [ "$PR_CURRENT_HEAD_SHA" != "$PR_HEAD_SHA" ]; then
            echo "::error::The PR state or head changed while CI was running; leaving it open."
            exit 1
          fi

          gh pr merge "$PR_NUMBER" --repo "$GH_REPO" --merge --match-head-commit "$PR_HEAD_SHA"
